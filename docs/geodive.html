:var(--mint)}.badtext{color:var(--bad)}.gameactions{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:23px}.recallform{display:flex;gap:10px;margin:26px 0 8px}.recallform input{flex:1;min-width:0}.smallprint{color:var(--muted);font-size:12px}.timer{font:14px ui-monospace,monospace;color:var(--gold)}.depth{display:flex;align-items:center;gap:12px;margin:17px 0}.depth .track{flex:1;height:7px}.depth span{font-size:12px;color:var(--muted);white-space:nowrap}.stepdots{display:flex;gap:5px}.stepdots i{width:10px;height:10px;border-radius:50%;background:var(--line)}.stepdots i.done{background:var(--mint)}.stepdots i.fail{background:var(--bad)}.stepdots i.now{outline:2px solid var(--gold);outline-offset:2px}.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin:25px 0}.stat{padding:21px 14px;background:var(--panel);border:1px solid var(--line);border-radius:16px}.stat strong{display:block;font-size:30px;color:var(--mint);letter-spacing:-1px}.stat span{font-size:12px;color:var(--muted)}.result{text-align:center;padding-top:20px}.result .ring{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--mint) var(--angle),#233e48 0);margin:25px auto}.ring b{background:var(--bg);border-radius:50%;width:102px;height:102px;display:grid;place-items:center;font-size:29px}.review{border:1px solid var(--line);border-radius:14px;margin:10px 0;padding:17px 20px;background:var(--panel)}.review summary{cursor:pointer;font-weight:600;line-height:1.45}.review p{margin:13px 0 0;overflow-wrap:anywhere}.review .source{font-size:12px;color:var(--muted)}.historyrow{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:16px 0;border-bottom:1px solid var(--line)}dialog{background:#102b38;color:var(--ink);border:1px solid #38535e;border-radius:24px;padding:30px;width:min(560px,calc(100% - 28px));max-height:85dvh;overflow:auto}dialog::backdrop{background:#020e19d9;backdrop-fil [
['A regular nonagon has how many diagonals?','27','18','36','9','n(n−3)/2 = 9×6/2 = 27.','SRC-POLY p.17'],

['A polygon has an interior-angle sum of 1800°. How many sides?','12','10','11','9','(n−2)180° = 1800° gives n = 12.','SRC-POLY p.18'],
['A regular polygon has 464 diagonals. How many sides?','32','29','31','34','n(n−3)/2 = 464 gives n = 32; reject the negative root.','SRC-POLY p.19'],
['Similar polygons have side ratio 2:3. Their area ratio is…','4:9','2:3','8:27','3:2','Areas scale as the square of the corresponding length ratio.','SRC-POLY p.11'],
['Which formula gives area using perimeter P and apothem a?','Pa/2','Pa','P²/2','2Pa','Sum the central triangles: area = one-half × perimeter × apothem.','SRC-POLY p.16']
],[
['A 5–12–13 cm triangle has area…','30 cm²','60 cm²','15 cm²','78 cm²','It is right-angled: 5×12/2 = 30.','SRC-TRI p.12'],

['Which point is the intersection of a triangle’s medians?','Centroid','Incenter','Orthocenter','Circumcenter','A median joins a vertex to the opposite side’s midpoint; the medians meet at the centroid.','SRC-TRI p.5'],
['The altitude to the 13 cm side of a 5–12–13 triangle is…','60/13 cm','13/2 cm','5 cm','12 cm','h = 2A/base = 60/13.','SRC-TRI p.7'],
['The median to the hypotenuse of a 5–12–13 triangle is…','6.5 cm','13 cm','5 cm','12 cm','The median from the right-angle vertex has half the hypotenuse’s length.','SRC-TRI p.7'],
['Sides 12 in and 24 in enclose a triangle of area 72 in². Which included angles work?','30° and 150°','30° only','60° and 120°','45° and 135°','72 = ½(12)(24)sin θ gives sin θ = ½.','SRC-TRI p.15'],
['An isosceles triangle has perimeter 72 cm and one side 20 cm. Its maximum possible area is…','240 cm²','192 cm²','360 cm²','144 cm²','Sides 26,26,20 give area 240; sides 20,20,32 give 192.','SRC-TRI p.14']
],[
['A rectangle has perimeter 24 cm and length three times its width. Its area is…','27 cm²','36 cm²','18 cm²','48 cm²','L+W = 12 and L = 3W, so W = 3 and L = 9.','SRC-QUAD p.9'],
['That 9 cm × 3 cm rectangle has diagonal…','3√10 cm','√50 cm','12 cm','6√3 cm','The diagonal is √(9²+3²) = √90 = 3√10.','SRC-QUAD p.9, corrected'],
['A square has area 25 cm². Its perimeter is…','20 cm','25 cm','10 cm','100 cm','Side = 5 cm; perimeter = 4×5.','SRC-QUAD p.11'],

['A parallelogram has sides 10 and 15 cm with included angle 135°. Its area is…','75√2 cm²','150 cm²','150√2 cm²','75 cm²','Area = ab sin θ = 150×√2/2.','SRC-QUAD p.7'],
['A rhombus has diagonals 6 and 8 cm. Its area is…','24 cm²','48 cm²','20 cm²','30 cm²','Area = d₁d₂/2 = 24.','Content pack QD-P01, supplemental'],

],[
['What is the directed distance from 6 to −4 on a number line?','−10','10','−2','2','Directed displacement is final coordinate minus initial coordinate: −4−6.','SRC-CART p.12'],

['The distance between (0,12) and (0,28) is…','16','40','28','12','The segment is vertical: |28−12| = 16.','SRC-CART p.16'],

],[

],[
['Find the center of x²+y²−8x+15 = 0.','(4,0)','(−4,0)','(0,4)','(8,0)','Completing the square gives (x−4)²+y² = 1.','SRC-CIRC p.17'],
['Find the radius of 3x²+3y²−6x+12y−15 = 0.','√10','10','√5','5','Divide by 3 and complete squares: (x−1)²+(y+2)² = 10.','SRC-CIRC p.18'],
['A circle has diameter endpoints (−3,4) and (5,8). Its center is…','(1,6)','(2,4)','(4,2)','(−1,6)','The center is the midpoint of the diameter.','SRC-CIRC pp.21–23'],
['A circle has center (2,2), radius 3. What is its tangent at (5,2)?','x = 5','x = 2','y = 2','y = 5','The radius is horizontal; the tangent is vertical through (5,2).','SRC-CIRC p.32, corrected'],
['A circle centered at (1,1) is tangent to 4x−3y−26 = 0. Its radius is…','5','2','25','√5','Distance = |4−3−26|/√(16+9) = 25/5 = 5.','SRC-CIRC p.33, corrected'],
['The real locus of x²+y²−2x−4y+5 = 0 is…','A single point','A positive-radius circle','An empty set','A pair of lines','(x−1)²+(y−2)² = 0 has only the point (1,2).','SRC-CIRC p.29'],
['The real locus of x²+y²+4x−6y+15 = 0 is…','Empty','A circle of radius √2','A single point','A parabola','Completing the square gives (x+2)²+(y−3)² = −2.','SRC-CIRC p.27']
],[
['What is the focus of x² = 20y?','(0,5)','(0,20)','(5,0)','(0,−5)','Compare x² = 4py: p = 5.','SRC-PARA pp.16–17'],
['What is the directrix of x² = 20y?','y = −5','x = −5','y = 5','y = −20','The focus is (0,5), so the directrix is y = −5.','SRC-PARA p.17, corrected'],

function home(){stopTimer();round=null;view='home';document.title='GeoDive · Geometry, a little deeper';nav();const unique=BANK.filter(q=>db.items[q.id]?.correct>0).length;const best=db.history.length?Math.max(...db.history.map(h=>h.score)):0;const daily=db.history.filter(h=>h.kind==='daily'&&h.day===today());app.innerHTML=`<section class="hero"><div><div class="eyebrow" style="margin-bottom:18px">13 source PDFs · 15 modules</div><h1>A little deeper.<br><em>A lot clearer.</em></h1><p>Your geometry knowledge has hidden depths. Take a seven-prompt recall dive, or practice the module you want to master.</p><div class="actions" style="margin-top:27px"><button class="btn primary" data-action="daily">${daily.length?'Dive again':'Take the daily dive'} <span aria-hidden="true">↘</span></button><button class="btn" data-action="setup">Build a quiz</button></div><p class="smallprint" style="font-size:12px;margin:14px 0 0">7 typed prompts · 45 seconds each · ${esc(today())} · Manila day</p></div><div class="sea">${ocean}<span class="badge">DEPTH COMES FROM CURIOSITY.</span></div></section><div class="strip"><div><b>${BANK.length}</b><span>quiz questions</span></div><div><b>${unique}/${BANK.length}</b><span>solved at least once</span></div><div><b>${best.toLocaleString()} m</b><span>your best dive</span></div></div><section aria-labelledby="modules-title"><div class="sectionhead"><div><div class="eyebrow" style="margin-bottom:10px">Choose your waters</div><h2 id="modules-title">Every topic. Your pace.</h2></div><label class="search"><span class="sr">Search modules</span><input id="search" type="search" placeholder="Find a module…" style="width:100%"></label></div><div id="modules" class="grid">${moduleCards('')}</div></section><div class="note"><b style="color:var(--ink)">A learning game, with transparent scoring.</b><p>Recall answers earn 100–400 m by authored challenge tier. These are not measured popularity or rarity scores. Quiz answers earn 100 m each. Explanations use the corrected content pack.</p>${storageOK?'':'<p class="badtext">Browser storage is unavailable. You can play, but progress will not survive a reload.</p>'}</div>`;heading();}
function moduleCards(search){return MODULES.map((m,i)=>({m,i})).filter(({m})=>m.join(' ').toLowerCase().includes(search.toLowerCase())).map(({m,i})=>`<button class="module" data-action="setup" data-module="${i}" aria-label="Practice ${esc(m[0])}"><span class="index">${String(i+1).padStart(2,'0')} / GEOMETRY</span><span class="symbol" aria-hidden="true">${esc(m[2])}</span><h3>${esc(m[0])}</h3><p>${esc(m[1])}</p><div class="meta"><span>7 quiz questions + recall</span><span>${completed(i)}/7 solved</span></div><div class="track" aria-hidden="true"><i style="width:${completed(i)/7*100}%"></i></div></button>`).join('')||'<p class="empty">No matching modules. Try “circles” or “prisms”.</p>';}
function openDialog(html){modal.innerHTML=`<button class="close" data-action="close" aria-label="Close dialog">×</button>${html}`;if(!modal.open)modal.showModal();}
function setup(m=-1){setupMode='learn';openDialog(`<div class="eyebrow">Make it yours</div><h2 id="dialogtitle" style="margin:15px 0 10px">Choose a current.</h2><p class="quiet">Practice with feedback, take a focused test, or try open recall.</p><div class="field"><label for="moduleSelect">Module</label><select id="moduleSelect"><option value="-1">All 15 modules · mixed</option>${MODULES.map((x,i)=>`<option value="${i}" ${i===m?'selected':''}>${i+1}. ${esc(x[0])}</option>`).join('')}</select></div><div class="field"><label>Question style</label><div class="modes"><button class="on" data-action="mode" data-mode="learn" aria-pressed="true">Practice<small>Choices + instant explanation</small></button><button data-action="mode" data-mode="exam" aria-pressed="false">Test yourself<small>Choices; feedback at the end</small></button><button data-action="mode" data-mode="recall" aria-pressed="false" style="grid-column:1/-1">Deep recall<small>Type one valid answer. Higher authored tiers earn more depth.</small></button></div></div><div class="field"><label for="countSelect">Questions (limited to the available bank)</label><select id="countSelect"><option value="7">7 questions</option><option value="15">15 questions</option><option value="999">All available</option></select></div><div class="field"><label for="timerSelect">Time per prompt</label><select id="timerSelect"><option value="0">Untimed · take your time</option><option value="45">45 seconds</option><option value="90">90 seconds</option></select></div><button class="btn primary" data-action="start" style="width:100%;margin-top:10px">Start exploring ↘</button>`);}
function start(kind='custom',ids=null){let mode,seconds,count,m,qs,label;if(kind==='daily'){mode='recall';seconds=45;m=-1;count=7;qs=shuffle(OPEN,seedRandom('geodive-v1-'+today())).slice(0,7);label='Daily dive';}else if(kind==='retry'){mode=round.mode;seconds=round.seconds;qs=ids.map(id=>[...BANK,...OPEN].find(q=>q.id===id)).filter(Boolean);label='Another look';m=-1;}else{mode=setupMode;seconds=Number(document.getElementById('timerSelect').value);count=Number(document.getElementById('countSelect').value);m=Number(document.getElementById('moduleSelect').value);qs=shuffle((mode==='recall'?OPEN:BANK).filter(q=>m<0||q.m===m)).slice(0,count);label=m<0?'Mixed waters':MODULES[m][0];}if(!qs.length)return;modal.close();round={mode,seconds,qs,i:0,results:[],score:0,label,kind,day:today(),started:Date.now(),orders:qs.map(q=>q.type==='choice'?shuffle(q.choices.map((_,i)=>i)):null)};view='game';document.title='GeoDive · '+label;nav();question();}
function question(){stopTimer();selected=null;locked=false;remaining=round.seconds;const q=round.qs[round.i];const dots=round.qs.length<=15?`<div class="stepdots" aria-hidden="true">${round.qs.map((_,i)=>`<i class="${i<round.i?(round.results[i].correct?'done':'fail'):i===round.i?'now':''}"></i>`).join('')}</div>`:'';app.innerHTML=`<section class="stage"><div class="gamehead"><button class="btn small" data-action="quit">← Leave dive</button><span class="chip">${esc(round.label)}</span><span class="timer" id="clock" aria-label="Time remaining">${round.seconds?remaining+'s':'Untimed'}</span></div><div class="depth"><div class="track"><i style="width:${round.i/round.qs.length*100}%"></i></div><span>Prompt ${round.i+1} / ${round.qs.length}</span></div><div class="gamehead">${dots}<span class="quiet" style="margin-left:auto">${round.score.toLocaleString()} m deep</span></div><article class="questionbox"><div class="eyebrow">${esc(MODULES[q.m][0])} · ${q.type==='recall'?'Open recall':'Multiple choice'}</div><h2 id="questiontitle">${esc(q.prompt)}</h2>${q.type==='recall'?`<p class="quiet">${esc(q.scope)}</p><form id="recallform" class="recallform"><label class="sr" for="answer">Your answer</label><input id="answer" autocomplete="off" spellcheck="false" placeholder="One answer. Make it count." maxlength="120"><button class="btn primary" type="submit">Dive in ↘</button></form><p class="smallprint">100–400 m · authored tiers, not player rarity · one submission</p>`:`<div class="options" role="group" aria-label="Answer choices">${round.orders[round.i].map((a,i)=>`<button class="option" data-action="option" data-index="${a}" aria-pressed="false"><span class="letter">${'ABCD'[i]}</span><span>${esc(q.choices[a])}</span></button>`).join('')}</div>`}<div id="feedback" role="status" aria-live="polite"></div><div class="gameactions" id="gameactions"><button class="btn small" data-action="skip">Skip this prompt</button>${q.type==='choice'?'<button class="btn primary" id="check" data-action="check" disabled>Lock answer</button>':''}</div></article><p class="smallprint" style="margin:16px 5px">${q.type==='choice'?'Choose an answer, then lock it. Keyboard: 1–4 selects an option.':'Use a term from the requested lesson scope. Accepted aliases ignore punctuation and capitalization.'}${round.mode==='exam'?' Test mode: explanations appear at the end.':''}</p></section>`;heading();if(round.seconds){deadline=Date.now()+round.seconds*1000;lastTick=Date.now();ticker=setInterval(tick,200);}}
function tick(){if(!round||locked)return;const now=Date.now();if(modal.open)deadline+=now-lastTick;lastTick=now;remaining=Math.max(0,Math.ceil((deadline-now)/1000));const c=document.getElementById('clock');if(c){c.textContent=remaining+'s';c.style.color=remaining<=10?'var(--bad)':'var(--gold)';}if(remaining===0)settle(null,'timeout');}
function choose(i){if(locked||!round)return;selected=i;app.querySelectorAll('.option').forEach(b=>{const on=Number(b.dataset.index)===i;b.classList.toggle('selected',on);b.setAttribute('aria-pressed',String(on));});document.getElementById('check').disabled=false;}
function settle(value,reason='answer'){if(locked||!round)return;locked=true;stopTimer();const q=round.qs[round.i];let correct=false,answer='',tier=0;if(reason==='answer'){if(q.type==='choice'){correct=value===0;answer=q.choices[value];tier=correct?1:0;}else{answer=String(value).trim();const match=q.answers.find(a=>[a[0],...a[1].split('|')].some(s=>norm(s)===norm(answer)));if(match){correct=true;tier=match[2];answer=String(value).trim();}}}const points=correct?tier*100:0;round.score+=points;const result={id:q.id,correct,answer,points,reason,tier};round.results.push(result);const shown=reason==='timeout'?'Time is up':reason==='skip'?'Skipped':correct?'Nice dive.':'Not quite this time.';if(q.type==='choice'){app.querySelectorAll('.option').forEach(b=>{b.disabled=true;const n=Number(b.dataset.index);if(round.mode!=='exam'){if(n===0)b.classList.add('correct');else if(n===value)b.classList.add('wrong');}});}else{document.getElementById('answer').disabled=true;document.querySelector('#recallform button').disabled=true;}const f=document.getElementById('feedback');f.className='feedback '+(round.mode==='exam'?'':correct?'good':'bad');f.innerHTML=round.mode==='exam'?'<b>Answer recorded.</b><p>Your result and explanation will appear after the last prompt.</p>':`<b class="${correct?'goodtext':'badtext'}">${shown}${correct?' +'+points+' m':''}</b>${q.type==='choice'?`<p><b>Answer:</b> ${esc(q.choices[0])}</p>`:correct?`<p>Challenge tier ${tier} of 4. Different valid terms have different authored learning tiers.</p>`:'<p>This answer did not match the curated set. Review the recognized terms below.</p>'}<p>${esc(q.explain)}</p>${q.type==='recall'?answerSet(q):''}<p class="smallprint">Source: ${esc(q.source)}</p>`;document.getElementById('gameactions').innerHTML=`<span class="smallprint">${round.i+1} of ${round.qs.length} completed</span><button class="btn primary" data-action="next">${round.i+1===round.qs.length?'See your results':'Next prompt →'}</button>`;}
function answerSet(q){return `<details style="margin-top:14px"><summary>Recognized answers & challenge tiers</summary><div class="answers">${q.answers.map(a=>`<span>${esc(a[0])} <b style="color:var(--mint)">· ${a[2]*100} m</b></span>`).join('')}</div><p class="smallprint">Curated lesson scope, not an exhaustive general-knowledge dictionary. Aliases are matched exactly after punctuation and case normalization.</p></details>`;}
function next(){if(!locked||!round)return;if(++round.i>=round.qs.length)finish();else question();}
function finish(){stopTimer();for(const r of round.results){const x=db.items[r.id]||{attempts:0,correct:0};x.attempts++;if(r.correct)x.correct++;db.items[r.id]=x;}const record={day:round.day,at:new Date().toISOString(),kind:round.kind,label:round.label,mode:round.mode,score:round.score,correct:round.results.filter(r=>r.correct).length,total:round.qs.length};db.history.unshift(record);db.history=db.history.slice(0,60);persist();view='result';nav();const pct=Math.round(record.correct/record.total*100);app.innerHTML=`<section class="stage"><div class="result"><div class="eyebrow">Dive complete · ${esc(round.label)}</div><div class="ring" style="--angle:${pct*3.6}deg"><b>${pct}%</b></div><h1 style="font-size:clamp(35px,6vw,54px)">${pct===100?'Deeply understood.':pct>=70?'You’re finding your depth.':'Good questions leave ripples.'}</h1><p class="quiet">${pct===100?'Every prompt landed. Try a new module or a deeper recall run.':'Keep the explanations. Take another look at the ones that slipped by.'}</p></div><div class="statgrid"><div class="stat"><strong>${record.score.toLocaleString()} m</strong><span>Depth earned</span></div><div class="stat"><strong>${record.correct}/${record.total}</strong><span>Correct answers</span></div><div class="stat"><strong>${Math.max(1,Math.round((Date.now()-round.started)/60000))} min</strong><span>Elapsed time</span></div></div><div class="actions" style="justify-content:center;margin-bottom:35px"><button class="btn primary" data-action="home">Back to the surface</button>${record.correct<record.total?'<button class="btn" data-action="retry">Retry missed prompts</button>':''}<button class="btn" data-action="share">Copy result</button></div>${storageOK?'':'<p class="note">Progress could not be saved in this browser. This result is still available for the current session.</p>'}<h2 style="font-size:28px">Your dive, explained.</h2>${round.qs.map((q,i)=>review(q,round.results[i],i)).join('')}</section>`;heading();}
function review(q,r,i){return `<details class="review"><summary><span class="${r.correct?'goodtext':'badtext'}">${r.correct?'✓':'○'}</span> ${i+1}. ${esc(q.prompt)}</summary><p><b>Your answer:</b> ${esc(r.answer|| (r.reason==='timeout'?'No answer — time expired':'Skipped'))}</p>${q.type==='choice'?`<p><b>Correct answer:</b> ${esc(q.choices[0])}</p>`:answerSet(q)}<p>${esc(q.explain)}</p><p class="source">${esc(q.source)} · ${r.points} m</p></details>`;}
function progress(){stopTimer();round=null;view='progress';document.title='GeoDive · Your logbook';nav();const attempts=Object.values(db.items).reduce((a,x)=>a+x.attempts,0),correct=Object.values(db.items).reduce((a,x)=>a+x.correct,0);app.innerHTML=`<section style="padding:45px 0"><div class="eyebrow">Your own uncharted waters</div><h1 style="font-size:clamp(40px,6vw,62px);margin-top:17px">The dive log.</h1><p class="quiet">Stored on this browser when available. A module’s progress counts quiz questions solved at least once.</p><div class="statgrid"><div class="stat"><strong>${db.history.length}</strong><span>Recent completed runs</span></div><div class="stat"><strong>${attempts?Math.round(correct/attempts*100):0}%</strong><span>Accuracy across all attempts</span></div><div class="stat"><strong>${BANK.filter(q=>db.items[q.id]?.correct>0).length}/${BANK.length}</strong><span>Quiz questions solved</span></div></div><div class="sectionhead"><h2>Keep exploring.</h2><button class="btn small" data-action="setup">Build a quiz</button></div><div class="grid">${moduleCards('')}</div><h2 style="margin-top:40px">Recent dives</h2>${db.history.length?db.history.slice(0,15).map(h=>`<div class="historyrow"><div><b>${esc(h.label)}</b><div class="smallprint">${esc(h.day)} · ${esc(h.mode)} · ${h.correct}/${h.total} correct</div></div><strong class="goodtext">${Number(h.score).toLocaleString()} m</strong></div>`).join(''):'<p class="note">An empty logbook is an invitation. Complete a dive to start your record.</p>'}<div class="actions" style="margin-top:30px"><button class="btn danger small" data-action="reset">Reset local progress</button></div></section>`;heading();}
function about(){openDialog(`<div class="eyebrow">Geometry, with a little depth</div><h2 id="dialogtitle" style="margin-top:15px">How to dive.</h2><p><b>Daily dive:</b> seven typed recall prompts, 45 seconds each, deterministic for the Manila calendar day. You can replay it. Scores are personal, not an online leaderboard.</p><p><b>Module practice:</b> choose from 105 multiple-choice questions covering all 15 modules. Practice reveals explanations immediately; test mode waits until the end. Time limits are optional.</p><p><b>Deep recall:</b> type one valid term from the requested lesson scope. Higher authored tiers earn more depth: 100, 200, 300, or 400 m. Tiers are educational design choices, <b>not measured rarity or other players’ answers</b>. Punctuation and capitalization are ignored; listed aliases are supported. There is no unrestricted AI answer grader.</p><p><b>Quiz scoring:</b> 100 m per correct answer, no speed bonus. Incorrect, skipped, and timed-out prompts earn zero. The results percentage is accuracy, separate from depth.</p><p><b>Sources:</b> adapted from all 13 supplied Engineering Mathematics / Mathematics for Engineers PDFs, MPS Department, FEU Institute of Technology, through the corrected geometry content pack. Source codes on each explanation identify the relevant PDF family and page. Supplemental items are labeled. Ambiguous original problems are excluded.</p><details><summary>Source-code key</summary><p class="smallprint">SRC-POLY: Plane Figures and Polygons<br>SRC-TRI: Triangles<br>SRC-QUAD: Quadrilaterals<br>SRC-CART: Cartesian Coordinate System<br>SRC-LINE: Lines<br>SRC-CIRC: Circles<br>SRC-PARA: Parabola<br>SRC-ELLI: Ellipse<br>SRC-HYP: Hyperbola<br>SRC-PRISM: Prisms<br>SRC-BOX: Parallelepiped and Cubes<br>SRC-CYL: Cylinders<br>SRC-PYCS: Pyramid and Non-polyhedron (pyramids, cones, spheres)</p></details><p class="smallprint">Independent educational prototype inspired by Krillion’s short open-answer runs. No affiliation. Your progress stays on this browser; no account or server is required. This standalone version uses system fonts and does not include your project’s Hallmark import.</p><button class="btn primary" data-action="close">Got it</button>`);}
function askLeave(destination){openDialog(`<h2 id="dialogtitle">Return to the surface?</h2><p>Leaving ends this run. Only completed runs contribute to your logbook.</p><div class="actions"><button class="btn primary" data-action="close">Keep diving</button><button class="btn" data-action="leave" data-to="${destination}">Leave this run</button></div>`);}
async function share(){const correct=round.results.filter(r=>r.correct).length;const text=`GeoDive · ${round.label}\n${correct}/${round.qs.length} correct · ${round.score} m\n${round.results.map(r=>r.correct?'🟩':'⬜').join('')}\n${round.day} · Authored challenge tiers, not player rarity.`;try{await navigator.clipboard.writeText(text);openDialog('<h2 id="dialogtitle">Copied.</h2><p>Your result is ready to paste.</p><button class="btn primary" data-action="close">Done</button>');}catch{openDialog(`<h2 id="dialogtitle">Your result</h2><p>Select and copy the text below.</p><textarea readonly style="width:100%;min-height:170px;background:var(--bg);color:var(--ink);padding:15px;border:1px solid var(--line);border-radius:10px">${esc(text)}</textarea>`);}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const action=b.dataset.action;if(action==='close'){modal.close();return;}if(action==='about'){about();return;}if(action==='home'||action==='progress'){if(view==='game'){askLeave(action);return;}action==='home'?home():progress();return;}if(action==='leave'){modal.close();b.dataset.to==='progress'?progress():home();return;}if(action==='quit'){askLeave('home');return;}if(action==='setup')setup(Number(b.dataset.module??-1));if(action==='mode'){setupMode=b.dataset.mode;modal.querySelectorAll('[data-mode]').forEach(x=>{x.classList.toggle('on',x===b);x.setAttribute('aria-pressed',String(x===b));});}if(action==='start')start();if(action==='daily')start('daily');if(action==='option')choose(Number(b.dataset.index));if(action==='check'&&selected!==null)settle(selected);if(action==='skip')settle(null,'skip');if(action==='next')next();if(action==='retry')start('retry',round.results.filter(r=>!r.correct).map(r=>r.id));if(action==='share')share();if(action==='reset')openDialog('<h2 id="dialogtitle">Clear your logbook?</h2><p>This removes scores and progress saved by GeoDive on this browser.</p><div class="actions"><button class="btn primary" data-action="close">Keep my progress</button><button class="btn danger" data-action="confirmreset">Reset progress</button></div>');if(action==='confirmreset'){db={items:{},history:[]};persist();modal.close();progress();}});
document.addEventListener('input',e=>{if(e.target.id==='search')document.getElementById('modules').innerHTML=moduleCards(e.target.value);});
document.addEventListener('submit',e=>{if(e.target.id==='recallform'){e.preventDefault();const input=document.getElementById('answer');if(input.value.trim())settle(input.value);else{input.setCustomValidity('Type an answer, or use Skip this prompt.');input.reportValidity();input.addEventListener('input',()=>input.setCustomValidity(''),{once:true});}}});
document.addEventListener('keydown',e=>{if(view==='game'&&!modal.open&&!locked&&round.qs[round.i].type==='choice'&&!/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)&&/^[1-4]$/.test(e.key)){e.preventDefault();choose(round.orders[round.i][Number(e.key)-1]);}});
window.addEventListener('pagehide',stopTimer);
home();
</script></body></html>
