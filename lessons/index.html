<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Browse the Engineering Mathematics 2 geometry course by module and lesson." />
    <meta name="theme-color" content="#f1eee3" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <title>Geometry lessons: Fieldnotes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@500&family=Spectral:ital,wght@0,400;0,500;0,700;1,400;1,500&family=Zilla+Slab:wght@700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header id="site-header"></header>
    <main id="main" class="course-index page-width">
      <noscript id="course-noscript"></noscript>
      <header class="course-index-heading">
        <p class="course-dateline">Engineering Mathematics 2</p>
        <h1>Geometry, from first principles.</h1>
        <p>Browse 15 modules and 49 short lessons, with worked examples and source notes.</p>
      </header>
      <form class="course-search" role="search">
        <label for="course-query">Find a module or lesson</label>
        <input id="course-query" type="search" autocomplete="off" />
        <p id="course-count" aria-live="polite"></p>
      </form>
      <div id="course-modules" class="course-modules"></div>
    </main>
    <footer id="site-footer"></footer>
    <p class="visually-hidden" id="theme-status" aria-live="polite"></p>
    <script type="module" src="/src/course-index.js"></script>
  </body>
</html>
